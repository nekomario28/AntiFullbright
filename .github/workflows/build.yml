name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle build failed; showing the final 160 lines."
            tail -n 160 gradle-build.log
            exit "$status"
          fi
          tail -n 40 gradle-build.log

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: antifullbright
          path: build/libs/antifullbright-*.jar
          if-no-files-found: error
