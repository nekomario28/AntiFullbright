name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle build failed; showing the final 160 lines."
            tail -n 160 gradle-build.log
            exit "$status"
          fi
          tail -n 40 gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antifullbright
          path: build/libs/antifullbright-*.jar
          if-no-files-found: error

      - name: Prepare dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt

      - name: Run dedicated server startup gate
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s \
            ./gradlew runServer --no-daemon > dedicated-server.log 2>&1
          status=$?
          set -e

          startup_marker='Done ('
          mod_marker='AntiFullbright dark-mining detection is ready'

          if ! grep -Fq "$startup_marker" dedicated-server.log; then
            echo "Dedicated server did not reach the Minecraft ready marker."
            tail -n 200 dedicated-server.log
            exit 1
          fi

          if ! grep -Fq "$mod_marker" dedicated-server.log; then
            echo "AntiFullbright did not reach its dedicated-server ready marker."
            tail -n 200 dedicated-server.log
            exit 1
          fi

          if grep -Eq 'NoClassDefFoundError|ClassNotFoundException|ModLoadingException|ModLoadingCrashException' dedicated-server.log; then
            echo "Dedicated server log contains a class-side or mod-loading failure."
            tail -n 200 dedicated-server.log
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            echo "Dedicated server process ended with unexpected status $status."
            tail -n 200 dedicated-server.log
            exit "$status"
          fi

          echo "Dedicated server startup gate passed; timeout termination was expected after readiness evidence."
          grep -F "$mod_marker" dedicated-server.log | tail -n 1
          grep -F "$startup_marker" dedicated-server.log | tail -n 1

      - name: Upload dedicated server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-log
          path: dedicated-server.log
          if-no-files-found: warn
          retention-days: 14
