name: Trigger pack metadata limit fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/client-content-scanner
          fetch-depth: 0

      - name: Apply strict pack metadata fix
        run: python3 .github/scripts/apply-pack-metadata-limit-fix.py

      - name: Commit reviewed fix
        shell: bash
        run: |
          git config user.name "nekomario28"
          git config user.email "206304251+nekomario28@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce resource-pack metadata limits consistently"
          git push origin HEAD:agent/client-content-scanner
