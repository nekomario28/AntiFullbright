name: External Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build exact beta JAR
        run: ./gradlew clean build --no-daemon

      - name: Install launcher runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flite1-dev python3-venv
          python3 -m venv .portablemc-venv
          .portablemc-venv/bin/python -m pip install --disable-pip-version-check 'portablemc[certifi]==4.4.1'
          .portablemc-venv/bin/portablemc show about
          chmod +x .github/scripts/launcher-client-smoke.sh

      - name: Run external launcher-managed client gates
        shell: bash
        run: bash .github/scripts/launcher-client-smoke.sh

      - name: Upload launcher-managed client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-client-evidence
          path: |
            launcher-client-clean.log
            launcher-client-startup-block.log
            launcher-client-mod.sha256
          if-no-files-found: warn
          retention-days: 14

  restart-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build exact beta JAR
        run: ./gradlew clean build --no-daemon

      - name: Install protocol test client
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts mineflayer@4.37.1
          node -e "console.log('mineflayer=' + require('mineflayer/package.json').version)"
          chmod +x .github/scripts/server-restart-persistence-smoke.sh

      - name: Run real server restart persistence gate
        shell: bash
        run: bash .github/scripts/server-restart-persistence-smoke.sh

      - name: Upload restart persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart-persistence-evidence
          path: |
            restart-persistence-install.log
            restart-persistence-first.log
            restart-persistence-second.log
            restart-persistence-bot-first.log
            restart-persistence-bot-second.log
            restart-persistence-data.sha256
            restart-persistence-mod.sha256
          if-no-files-found: warn
          retention-days: 14
