name: GameTest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run required GameTests
        shell: bash
        run: |
          set +e
          ./gradlew runGameTestServer --no-daemon > gametest.log 2>&1
          status=$?
          set -e
          cat gametest.log
          exit "$status"

      - name: Upload GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: gametest.log
          if-no-files-found: error
          retention-days: 14
