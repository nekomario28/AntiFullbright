name: GameTest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Prepare GameTest server
        shell: bash
        run: |
          mkdir -p run/gameTestServer
          printf 'online-mode=false\nserver-port=25567\n' > run/gameTestServer/server.properties

      - name: Run required GameTests
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s \
            ./gradlew runGameTestServer --no-daemon > gametest.log 2>&1
          status=$?
          set -e

          cat gametest.log

          if ! grep -Fq 'Registered AntiFullbright GameTests' gametest.log; then
            echo 'AntiFullbright GameTest registration marker was not found.'
            exit 1
          fi

          if ! grep -Fq '23 tests are now running' gametest.log; then
            echo 'The expected twenty-three GameTests were not started.'
            exit 1
          fi

          if ! grep -Fq 'All 23 required tests passed :)' gametest.log; then
            echo 'Required GameTest success summary was not found.'
            exit 1
          fi

          if grep -Eq 'No test functions were given|Missing test structure|[1-9][0-9]* required test(s)? failed|required tests failed :\(|Game test server crashed' gametest.log; then
            echo 'GameTest log contains a registration, structure, or required-test failure.'
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "GameTest process ended with unexpected status $status."
            exit "$status"
          fi

          echo 'GameTest gate passed with all twenty-three required tests successful.'

      - name: Upload GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-log
          path: gametest.log
          if-no-files-found: error
          retention-days: 14
