name: Repack Local Offline Bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/local-offline-export.request'

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '30697189479'

    steps:
      - name: Download successful combined bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repack
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name antifullbright-local-offline-bundle \
            --dir repack
          ls -lh repack

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-checksums
          path: repack/antifullbright-local-offline-bundle.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload part 000
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-000
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-000
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload part 001
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-001
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-001
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 002
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-002
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-002
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 003
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-003
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-003
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 004
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-004
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-004
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 005
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-005
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-005
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 006
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-006
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-006
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 007
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-007
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-007
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 008
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-008
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-008
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload part 009
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle-part-009
          path: repack/antifullbright-local-offline-bundle.tar.zst.part-009
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
