name: Trigger final scanner review fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/client-content-scanner
          fetch-depth: 0

      - name: Execute reviewed fix script
        shell: bash
        run: |
          awk '
            /^          python3 - <<'\''PY'\''$/ { capture = 1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-final-review-fixes.yml > /tmp/apply-final-review-fixes.py
          test -s /tmp/apply-final-review-fixes.py
          head -n 1 /tmp/apply-final-review-fixes.py | grep -F 'from pathlib import Path'
          python3 /tmp/apply-final-review-fixes.py
          rm -f .github/workflows/trigger-final-review-fixes.yml

      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "nekomario28"
          git config user.email "206304251+nekomario28@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce precise scanner policy boundaries"
          git push origin HEAD:agent/client-content-scanner
