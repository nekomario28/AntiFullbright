name: Trigger final scanner review fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/client-content-scanner
          fetch-depth: 0

      - name: Apply reviewed scanner fixes
        run: python3 .github/scripts/apply-final-review-fixes.py

      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "nekomario28"
          git config user.email "206304251+nekomario28@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce precise scanner policy boundaries"
          git push origin HEAD:agent/client-content-scanner
