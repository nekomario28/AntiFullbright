name: Cross-platform Scanner

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-tests:
    name: Scanner tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run scanner, watcher, localization, and disclosure tests
        shell: bash
        run: |
          ./gradlew test --no-daemon \
            --tests 'dev.antifullbright.client.*' \
            --tests 'dev.antifullbright.MessagesTest' \
            --tests 'dev.antifullbright.DocumentationSecurityTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-scanner-${{ matrix.os }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 14
